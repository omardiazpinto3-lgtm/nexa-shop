<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexa E-Shop · Wholesale flowers Chicago</title>
<meta name="nexa-version" content="2026-11-02">
<meta name="description" content="Wholesale fresh flowers for Chicago florists. Weekly delivery from partner farms in Ecuador and Colombia.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123524">
<meta name="apple-mobile-web-app-title" content="Nexa">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: brand header + forest band, category rail over a product grid; cart slides in from the right. Mirrors nexaflowersgroup.com. */
:root{
  --forest:#102A20; --forest-2:#123629; --cream:#F7F2E9; --paper:#FFFFFF; --gold:#BF9650; --gold-ink:#8F6E34;
  --wine:#862633; --bark:#583B1F; --sage:#60675F; --mist:#D8DDD8; --line:rgba(18,54,41,.18);
  --bg:var(--cream); --fg:var(--forest); --muted:var(--sage); --surface:var(--paper); --band:var(--forest); --band-fg:#F7F2E9;
  --chip:#EFE8DA; --ok:#2E6B4A; --warn:#9A6A12;
  --display:"Marcellus","Times New Roman",Georgia,serif; --body:"PT Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1F18; --fg:#EFE8DA; --muted:#A9B3AA; --surface:#F7F2E9; --band:#071711; --band-fg:#F7F2E9;
  --line:rgba(239,232,218,.18); --chip:#173327; --gold-ink:#D7B377; --ok:#7FC7A0; --warn:#E3B45C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1F18; --fg:#EFE8DA; --muted:#A9B3AA; --surface:#F7F2E9; --band:#071711; --band-fg:#F7F2E9;
  --line:rgba(239,232,218,.18); --chip:#173327; --gold-ink:#D7B377; --ok:#7FC7A0; --warn:#E3B45C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.caps{text-transform:uppercase;letter-spacing:.12em;font-size:.68rem}
.disp{font-family:var(--display);font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.gold-btn{display:inline-flex;align-items:center;gap:.6em;background:var(--gold);border:1px solid var(--gold);color:#102A20;padding:.95em 1.3em;text-transform:uppercase;letter-spacing:.11em;font-size:.7rem;cursor:pointer;text-decoration:none;font-weight:700}
.gold-btn:hover{background:#CDA762}
.gold-btn[disabled]{opacity:.45;cursor:not-allowed}
.line-btn{display:inline-flex;align-items:center;gap:.5em;background:transparent;border:0;border-bottom:1px solid currentColor;padding:0 0 .35em;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;cursor:pointer;text-decoration:none}
.ghost{background:transparent;border:1px solid var(--line);padding:.55em .9em;cursor:pointer}
.ghost:hover{border-color:var(--gold)}

/* header */
.proto{background:var(--wine);color:#F7F2E9;font-size:.72rem;text-align:center;padding:.4em 0;letter-spacing:.04em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;line-height:1}
.brand b{font-family:var(--display);font-weight:400;font-size:1.65rem;letter-spacing:.32em}
.brand span{font-size:.5rem;letter-spacing:.38em;text-transform:uppercase;margin-top:.35em;color:var(--muted)}
nav.main{display:flex;gap:6px;margin-left:24px}
nav.main a{text-decoration:none;padding:.45em .95em;border-radius:300px;font-size:.92rem}
nav.main a[aria-current="page"]{background:var(--wine);color:#fff}
nav.main a:hover:not([aria-current]){background:var(--chip)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:18px}
.cart-btn{position:relative}
.cart-btn .n{background:var(--forest);color:#F7F2E9;border-radius:99px;padding:0 .55em;margin-left:.2em;font-size:.68rem}
.acct{font-size:.8rem;color:var(--muted);white-space:nowrap}
@media (max-width:820px){ nav.main{display:none} .acct, .back-site{display:none} .top .mnav{display:flex} }
.top .mnav{display:none;height:auto;gap:4px;padding-block:8px;border-top:1px solid var(--line);overflow-x:auto}
@media (max-width:820px){ .top .mnav{display:flex;flex-wrap:wrap;overflow-x:visible} }
.mnav a{text-decoration:none;padding:.35em .8em;border-radius:300px;font-size:.85rem;white-space:nowrap}
.mnav a[aria-current="page"]{background:var(--wine);color:#fff}

/* band */
.band{background:var(--band);color:var(--band-fg)}
.band .wrap{padding-block:48px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.band h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:.98;margin:.3em 0 0;text-transform:uppercase}
.band h1 i{font-family:var(--body);font-style:italic;text-transform:uppercase;letter-spacing:-.02em}
.band .eyebrow{color:var(--gold)}
.band p{max-width:42ch;margin:0;color:rgba(247,242,233,.82);font-size:.95rem}
.deliv{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.deliv div{border-top:1px solid rgba(247,242,233,.25);padding-top:10px;min-width:150px}
.deliv strong{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:#F7F2E9}
@media (max-width:820px){.band .wrap{grid-template-columns:1fr;padding-block:32px 28px}}

/* category rail */
.rail{border-bottom:1px solid var(--line);background:var(--bg)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.rail button{background:none;border:0;border-bottom:2px solid transparent;padding:1.1em .9em .95em;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;color:var(--muted)}
.rail button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.rail button sup{font-size:.62rem;margin-left:.3em;letter-spacing:0;color:var(--gold-ink)}

/* toolbar + grid */
.shop{display:grid;grid-template-columns:220px 1fr;gap:36px;padding-block:28px 64px}
@media (max-width:900px){.shop{grid-template-columns:1fr;gap:16px}}
aside.filters{display:flex;flex-direction:column;gap:22px;min-width:0}
aside h3{margin:0 0 .6em}
.search{width:100%;padding:.7em .8em;border:1px solid var(--line);background:var(--surface);color:#102A20}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.checks label{display:flex;gap:.5em;align-items:center;font-size:.9rem;cursor:pointer;padding:.15em 0}
.fam-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.fam-list button{background:none;border:0;text-align:left;padding:.25em 0;cursor:pointer;font-size:.9rem;color:var(--muted)}
.fam-list button[aria-pressed="true"]{color:var(--fg);font-weight:700}
@media (max-width:900px){
  aside.filters{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
  aside.filters .fgroup{flex:1 1 220px}
  aside.filters .famg{display:none}
}
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.results-head h2{margin:0;font-size:1.7rem}
.results-head select{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.45em .6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 20px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.card{display:flex;flex-direction:column;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0}
.card .ph{position:relative;aspect-ratio:1;max-width:100%;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .5s ease}
.card:hover img{transform:scale(1.04)}
.tag{position:absolute;top:10px;left:10px;background:var(--forest);color:#F7F2E9;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:.35em .6em}
.tag.gold{background:var(--gold);color:#102A20}
.card .fam{color:var(--muted)}
.card h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.22rem;line-height:1.15}
.card .price{font-size:.88rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .price b{font-variant-numeric:tabular-nums}
.card .len{color:var(--muted);font-size:.8rem}
.empty{padding:40px 0;color:var(--muted)}

/* product dialog */
.scrim{position:fixed;inset:0;background:rgba(7,23,17,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg);color:var(--fg);max-width:960px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
@media (max-width:760px){.dlg{grid-template-columns:1fr}}
.dlg .ph{background:var(--paper);display:flex;align-items:center;justify-content:center;min-height:280px}
.dlg .ph img{width:100%;max-width:480px;aspect-ratio:1;object-fit:contain}
.dlg .body{padding:32px 32px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dlg h2{margin:0;font-size:2.2rem;line-height:1.05}
.x{position:absolute;top:10px;right:12px;background:var(--bg);border:1px solid var(--line);width:36px;height:36px;cursor:pointer;font-size:1.2rem;line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.55em .8em;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:84px}
.opt small{font-size:.72rem;color:#60675F;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#FBF6EC}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line)}
.qty button{width:40px;height:40px;background:none;border:0;cursor:pointer;font-size:1.1rem}
.qty input{width:56px;text-align:center;border:0;background:transparent;height:40px;font-variant-numeric:tabular-nums}
.sum{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum .tot{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.colsel{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.55em .6em;min-width:180px}

/* cart drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:60;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(7,23,17,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:1.5rem}
.lines{flex:0 0 auto;padding:8px 22px}
.drawer{overflow-y:auto}
.drawer header{position:sticky;top:0;background:var(--bg);z-index:2}
.ln{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.ln img{width:64px;height:64px;object-fit:contain;background:var(--paper);border:1px solid var(--line)}
.ln h5{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem}
.ln .meta{font-size:.78rem;color:var(--muted)}
.ln .amt{text-align:right;font-variant-numeric:tabular-nums;font-size:.92rem;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ln .qty button{width:30px;height:30px}.ln .qty input{width:38px;height:30px}
.rm{background:none;border:0;color:var(--muted);font-size:.72rem;text-decoration:underline;cursor:pointer;padding:0}
.drawer footer{padding:18px 22px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.row.big{font-family:var(--display);font-size:1.35rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.6em .7em}
.minnote{font-size:.78rem;color:var(--warn)}

/* views */
.view{padding-block:40px 72px}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:560px}
@media (max-width:820px){.login{grid-template-columns:1fr}}
.login .l{background:var(--band);color:var(--band-fg);padding:56px max(16px,6vw);display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.login .l h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:.98;margin:0;text-transform:uppercase}
.login .l h1 i{font-family:var(--body)}
.login .l p{max-width:40ch;color:rgba(247,242,233,.82);margin:0}
.login .r{padding:56px max(16px,6vw);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:560px}
.login .r h2{margin:0;font-size:2rem}
.note{font-size:.82rem;color:var(--muted);border-left:2px solid var(--gold);padding-left:12px}
.pending{background:var(--chip);padding:18px;display:flex;flex-direction:column;gap:8px}
table.orders{width:100%;border-collapse:collapse;font-size:.92rem}
.tw{overflow-x:auto}
table.orders th{text-align:left;font-weight:400;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:.8em .6em;border-bottom:1px solid var(--line);white-space:nowrap}
table.orders td{padding:1em .6em;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.orders tr.main{cursor:pointer}
table.orders tr.main:hover td{background:var(--chip)}
.pill{display:inline-block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:.35em .7em;border:1px solid currentColor;white-space:nowrap}
.pill.paid{color:var(--ok)}.pill.sourcing{color:var(--gold-ink)}.pill.shipped{color:var(--wine)}.pill.delivered{color:var(--muted)}.pill.pending{color:var(--warn)}.pill.awaiting{color:var(--warn)}
.detail td{background:var(--chip);font-size:.85rem}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.acct-grid section{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
.kv span:first-child{color:var(--muted)}
.paybox{max-width:620px;display:flex;flex-direction:column;gap:18px}
.stripe{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:22px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:#F7F2E9;padding:.8em 1.2em;z-index:80;font-size:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
footer.site{border-top:1px solid var(--line)}
footer.site .wrap{padding-block:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.dispo-form{display:flex;gap:16px;flex-wrap:wrap}
.dispo-form label{display:flex;flex-direction:column;gap:6px}
.dispo-form select,.dispo-form input{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.5em .7em;font:inherit}
.dispo-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
.dmsg{font-size:.85rem;color:var(--muted)}
.dreview input{border:1px solid var(--line);background:var(--surface);color:#102A20;padding:.3em .4em;font:inherit;font-size:.85rem}
.dreview input[list]{width:100%;min-width:180px}
.dreview tr.warn td{background:#FFF3C4}
.dreview tr.ign td{opacity:.45}
.dreview td.orig{font-size:.8rem;color:var(--muted);max-width:260px}
.dispo-cell{font-size:.78rem;line-height:1.35}
.nodispo{color:var(--wine)}

.av{display:inline-block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.2em .5em;margin-top:4px}
.av.ok{background:#E3EEDF;color:#1F4D2E}
.av.ask{background:#F6ECD6;color:#6B4E12}
.card .av{align-self:flex-start}
.avnote{font-size:.8rem;color:var(--muted);margin:.7em 0 0;line-height:1.5}
.avnote .av{margin:0 6px 0 0}
.subs{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.subs legend{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;padding:0}
.subs label{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:.85rem;color:#102A20}
.wa-fab{position:fixed;right:18px;bottom:76px;z-index:40;display:flex;align-items:center;gap:8px;background:#1F4D2E;color:#F7F2E9;padding:.7em 1em;border-radius:999px;text-decoration:none;font-size:.85rem;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.wa-fab[hidden]{display:none}
@media(max-width:600px){.wa-fab span{display:none}.wa-fab{padding:.8em}}
.wa-link{font-size:.78rem;white-space:nowrap;color:#1F4D2E}
.also{font-size:.78rem;color:var(--gold-ink);margin-top:-2px}

.hcard{border:1px solid var(--line);background:var(--surface);padding:18px;margin-top:16px}
.hhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.hhead span{font-size:.85rem;color:var(--muted)}
.hchart{width:100%;height:auto;display:block;margin:8px 0 14px}
.hchart .grid{stroke:#E4DDCF;stroke-width:1}
.hchart .ax{font-size:11px;fill:#7A7466}
.hchart .pl{font-size:11px;font-weight:600}
.lgs{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin-top:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.up{color:#B0413E;font-weight:600}.down{color:#1F4D2E;font-weight:600}

.mins{border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mins .caps{font-size:.62rem;color:var(--muted)}
.min .mrow{display:flex;justify-content:space-between;font-size:.82rem;gap:8px}
.min .bar{height:5px;background:#E9E2D4;margin-top:4px}
.min .bar i{display:block;height:100%;background:#C9963B}
.min.ok .bar i{background:#1F4D2E}.min.ok .mrow span:last-child{color:#1F4D2E;font-weight:600}
.mins small{font-size:.7rem;color:var(--muted)}

.paym{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.paym legend{font-size:.68rem;color:var(--muted);margin-bottom:6px;padding:0}
.popt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;background:var(--surface);cursor:pointer}
.popt:has(input:checked){border-color:#1F4D2E;box-shadow:inset 3px 0 0 #1F4D2E}
.popt span{display:flex;flex-direction:column;gap:2px}.popt small{color:var(--muted);font-size:.78rem;line-height:1.4}
.zbox{display:flex;flex-direction:column;gap:4px;border:1px dashed #C9963B;background:#FBF6EA;padding:12px 14px;font-size:.9rem}
.zbox .caps{font-size:.62rem;color:var(--gold-ink)}
</style>

<style>
/* admin additions */
[hidden]{display:none!important}
.admin-band{background:var(--wine);color:#F7F2E9}
.admin-band .wrap{padding-block:28px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}

/* ---------- pedido mínimo por tipo (el cliente mezcla variedades como quiera) ---------- */
const perQB = len => len>=70 ? 3 : len>=50 ? 4 : 5;   // bunches de 25 que entran en un QB según largo
function minimums(cart){
  const g={rosas:{label:"Roses, garden & spray roses",min:"1 QB",have:0,need:1,unit:"QB"},
           fill:{label:"Fillers & summer flowers",min:"1 EB (4 bunches)",have:0,need:4,unit:"bunches"},
           verd:{label:"Greens",min:"1 EB (7 bunches)",have:0,need:7,unit:"bunches"}}, used={};
  cart.forEach(l=>{ const t=BYID[l.id]?BYID[l.id].t:0, len=parseInt(l.opt)||50;
    if(t<=3){ g.rosas.have+=l.b/perQB(len); used.rosas=1; }
    else if(t===4||t===5){ g.fill.have+=l.b; used.fill=1; }
    else if(t===6){ g.verd.have+=l.b; used.verd=1; } });
  return Object.entries(g).filter(([k])=>used[k]).map(([k,x])=>({...x,key:k,ok:x.have>=x.need-1e-9}));
}
function minsHTML(m){
  if(!m.length) return "";
  return `<div class="mins"><span class="caps">Minimum order per type · mix any varieties</span>${m.map(x=>{ const pct=Math.min(100,Math.round(x.have/x.need*100));
    const left = x.unit==="QB" ? `${pct}% of a QB` : `${x.have} of ${x.need} bunches`;
    return `<div class="min ${x.ok?"ok":""}"><div class="mrow"><span>${x.label}</span><span>${x.ok?"✓ "+x.min:left}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`; }).join("")}
    ${m.some(x=>x.key==="rosas")?`<small>1 QB = 5 bunches at 40 cm, 4 at 50–60 cm or 3 at 70 cm+.</small>`:""}</div>`;
}

function farmOptions(line){
  const offer = OFFER[line.id] || [];
  const len = parseInt(line.opt)||null;
  return offer.filter(([fid,L])=>!len||!L.length||L.includes(len)).map(([fid])=>{
    const d=dispoFor(line.id,len).find(x=>x.finca==fid&&x.costo!=null);
    return {fid:+fid, name:FARMS[fid], cost: d? Math.round(d.costo*(line.s||1)*100)/100 : Math.round(line.u*FARM_FACTOR[fid]*100)/100, real:!!d};
  });
}

const NK = s => String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
function byKey(){ const m={}; ITEMS.forEach(i=>{ m[NK(i.n)]=i.id; }); Object.entries(CAT.alias||{}).forEach(([k,id])=>{ if(!(k in m)&&BYID[id]) m[k]=id; }); return m; }
function dice(a,b){ if(a===b) return 1; if(a.length<2||b.length<2) return 0; const m=new Map(); for(let i=0;i<a.length-1;i++){ const g=a.slice(i,i+2); m.set(g,(m.get(g)||0)+1); } let n=0; for(let i=0;i<b.length-1;i++){ const g=b.slice(i,i+2), c=m.get(g); if(c){ n++; m.set(g,c-1); } } return 2*n/(a.length+b.length-2); }
function findVar(name, tipos){
  const k=NK(name), M=byKey();
  if(M[k] && (!tipos || tipos.includes(BYID[M[k]].t))) return M[k];
  let best=null, bs=0;
  ITEMS.forEach(i=>{ if(tipos && !tipos.includes(i.t)) return; const s=dice(NK(i.n),k); if(s>bs){ bs=s; best=i.id; } });
  return bs>=0.86 ? best : null;
}
const DSEC = [["MINI GERBERA","Gerbera Mini ",/^Mini Gerb(era)?\s+/i],["LILIES LA","LA Hybrids ",null],["LA LILIES","LA Hybrids ",null],["OT LILIES","O.T Lily ",null],
  ["BUTTERFLY LILIES","Butterfly Lily ",null],["ROSE LILIES","Rose Lily ",/^Rose ?lilies\s+/i],["POMPOM","Chrysanthemum Pompom ",/^Pompom\s+/i],
  ["SPRAY","",null],["ALSTROEMERIA","Alstroemeria ",null],["LARKSPUR","Larkspur ",null],["DELPHINIUM","Delphinium ",null],["RANUNCULUS","Ranunculus ",null],["ANEMONE","Anemone ",null]];
const GYP = {bqt:"Bouquet 10-20 tallos","750gr":"Select 750-1000 g","1000gr":"Premium 250-1000 g"};
/* Lee el formato típico de WhatsApp: *SECCIÓN precio*, "6 hb x 10bu Nombre", "7hb Rosa 50cm", tabla de rosas *40cm 0.24* */
function parseDispoTextProto(txt){
  const rows=[]; let sec="", secPrice=null; const roseLen={};
  txt.split(/\r?\n/).forEach(raw=>{
    const t=raw.trim(); if(!t) return;
    const m=t.match(/^\*([^*]+)\*$/);
    if(m){ const h=m[1].trim(), ml=h.match(/^(\d+)\s*cm\s+\$?([\d]+[.,]?\d*)$/i);
      if(ml && sec==="ROSES"){ roseLen[+ml[1]]=+ml[2].replace(",","."); return; }
      const mp=h.match(/^(.*?)\s+\$?(\d+[.,]\d+)$/);
      if(mp){ sec=mp[1].trim().toUpperCase(); secPrice=+mp[2].replace(",","."); } else { sec=h.toUpperCase(); secPrice=null; }
      return; }
    const mc=t.match(/^(\d+)\s*(hb|qb|eb|fb)\b\s*(?:x\s*(\d+)\s*(bu)?)?\s*(.*)$/i);
    if(!mc){ rows.push({texto:t,id:null,nombre:t,largo:null,pres:"",cajas:null,caja:"",uxc:null,unidad:"",costo:null,nota:"",ignorar:true}); return; }
    const cajas=+mc[1], caja=mc[2].toUpperCase(), uxc=mc[3]?+mc[3]:null, bu=!!mc[4], resto=mc[5].trim();
    const ml2=resto.match(/(\d+)\s*cm\b/i); const largo=(ml2 && !/\d+\s*-\s*\d+\s*cm/i.test(resto))? +ml2[1] : null;
    const mb=resto.match(/(\d-\d)\s*blooms/i), nota=mb? mb[1]+" botones" : "";
    let name, id=null, pres="", costo=null;
    if(sec==="ROSES" || sec.startsWith("ROSAS")){ name=resto.replace(/\s*\d+\s*cm\b/i,"").trim(); costo=roseLen[largo]??secPrice; id=findVar(name,[1,2]); }
    else if(sec.startsWith("GYPSOPHILA")){ const g=Object.keys(GYP).find(k=>resto.toLowerCase().includes(k)); pres=g?GYP[g]:""; name="Gypsophila XLence Natural"; id=findVar(name); costo=secPrice; }
    else {
      const d=DSEC.find(([k])=>sec.startsWith(k)); const pref=d?d[1]:"", rx=d?d[2]:null;
      name=(rx? resto.replace(rx,"") : resto).replace(/\s*\d-\d\s*blooms/i,"").replace(/\s*\d+(-\d+)?\s*cm/i,"").replace(/\s+white magical/i,"").trim();
      costo=secPrice; const w=name.split(/\s+/);
      const cands=[pref+name, ...name.split("/").map(x=>pref+x.trim()), ...w.map((_,i)=>pref+w.slice(0,w.length-i).join(" "))];
      for(const c of cands){ id=findVar(c); if(id) break; }
    }
    rows.push({texto:t,id,nombre:name,largo,pres,cajas,caja,uxc,unidad:bu?"bunches":(uxc?"tallos":""),costo,nota,ignorar:false});
  });
  return rows;
}

<script>
/* ---------- reglas de precio (iguales a la hoja "Nexa – Costos y precios" / pricing.py) ---------- */
const PR = {
  ROSA:{40:.85,50:.95,60:1.05,70:1.15,80:1.25,90:1.35,100:1.45},
  T2:.068, T3:2.2, T9:380/300, T10:.05, T11:.03,
  KG:{1:1,2:.8,3:.7,4:1,5:1.2,6:.8,7:1.2},            // por tipo_id
  EXO:{Leucadendron:.70,Leucospermum:.75,Protea:.70},
  M_ROSA:.40, M_GARDEN:.70, M_OTRAS:.50,
  GARDEN_MIN:{40:2.00,50:2.25,60:2.50,70:2.75,80:3.00,90:3.25},
  MANUAL:{"Red Panther|80":45}
};
const ceil25 = x => Math.ceil(x/0.25-1e-9)*0.25;
function tallosDefault(it){ return {1:25,2:12,3:10}[it.t] || (/^Gypsophila/i.test(it.f||"")?1 : /^(Leucospermum|Protea)$/.test(it.f||"")?5 : 10); }
function costoPuesto(it,s,c){ return (s*c*(1+PR.T2)+PR.KG[it.t]*PR.T3+PR.T9)*(1+PR.T10); }
function precioVenta(it,l,s,c){
  if(it.t===1){ const base=PR.ROSA[l]!=null? PR.ROSA[l]*s : null; if(c==null) return base; return Math.max(ceil25(costoPuesto(it,s,c)/(1-PR.T11-PR.M_ROSA)), base||0); }
  if(c==null) return null;
  if(it.t===2){ const piso= l? (PR.GARDEN_MIN[l]??2.00)*s : 0; return Math.max(ceil25(costoPuesto(it,s,c)/(1-PR.T11-PR.M_GARDEN)), ceil25(piso)); }
  const m = it.t===7 ? (PR.EXO[it.f]??.70) : PR.M_OTRAS;
  return ceil25(costoPuesto(it,s,c)/(1-PR.T11-m));
}
if(typeof module!=="undefined") module.exports={PR,precioVenta,tallosDefault};

/* ---------- "Actualizar precios con este disponible" ---------- */
// Costo base de cada variedad/largo: lo más barato entre las fincas que mandaron disponible con cajas en los últimos 7 días;
// si ninguna tiene cajas, lo más barato entre listas de precio recientes y el costo cargado (oferta_finca).
function costoBase(id, l, pres){
  const fr = freshDispo().filter(d=>!precioFijo(d.finca)).flatMap(d=>d.rows.map(r=>({...r,finca:d.finca}))).filter(r=>r.id===id && r.costo!=null && (r.pres||"")===(pres||"") && ((r.largo||null)===(l||null)));
  const conCajas = fr.filter(r=>r.cajas!=null);
  const pool = conCajas.length ? conCajas : fr.concat((OFFER_LIVE[id]||[]).filter(o=>o.costo_usd!=null && (o.largo_cm||null)===(l||null) && ((o.presentacion||"").startsWith("Bunch ")?o.presentacion:"")===(pres||"")).map(o=>({costo:+o.costo_usd,finca:o.finca_id,lista:true})));
  if(!pool.length) return null;
  const b = pool.reduce((a,x)=>x.costo<a.costo?x:a);
  return {costo:+b.costo, finca:b.finca, cajas:b.cajas!=null};
}
const FINCAS_PRECIO_FIJO = ["Bellaflor","Proteas"];   // trabajan con su lista de precios; su disponible solo dice qué hay
const precioFijo = fid => FINCAS_PRECIO_FIJO.some(n=>(FARMS[fid]||"").toLowerCase().includes(n.toLowerCase()));
function proponerPrecios(d){
  const props=[], porVar={};
  if(precioFijo(d.finca)) return props;
  const seen=new Set();
  d.rows.forEach(r=>{
    if(r.costo==null || !r.id) return;
    const it=BYID[r.id]; if(!it) return;
    // a qué fila de precio corresponde: mismo largo; si la variedad se vende sin largo, la fila sin largo
    let l=r.largo||null; const pres=r.pres||"";
    if(l && it.o.length && !it.o.some(o=>(o.l||null)===l) && it.o.some(o=>!o.l && (o.p||"")===pres)) l=null;
    const k=r.id+"|"+(l||"")+"|"+pres; if(seen.has(k)) return; seen.add(k);
    const cb=costoBase(r.id,l,pres) || {costo:+r.costo,finca:d.finca,cajas:r.cajas!=null};
    const ex=it.o.find(o=>(o.l||null)===l && (o.p||"")===pres);
    const s=r.tb || (ex? ex.s : ((OFFER_LIVE[r.id]||[]).find(o=>o.tallos_por_bunch)||{}).tallos_por_bunch || tallosDefault(it));   // el bunch tal como lo arma la finca
    let u=precioVenta(it,l,s,cb.costo); if(u==null) return;
    const man=PR.MANUAL[it.n+"|"+(l||"")]; if(man!=null) u=man;
    (porVar[r.id] ||= []).push({id:r.id,it,l,pres,s,u,ex,costo:cb.costo,finca:cb.finca,cajas:cb.cajas,manual:man!=null,revisar:/^Gypsophila/i.test(it.f||"")&&!pres});
  });
  // un largo nunca más barato que uno más corto (rosas y garden), contando también los precios que no cambian
  Object.values(porVar).forEach(list=>{
    const it=list[0].it;
    if(it.t===1||it.t===2){
      const filas = it.o.filter(o=>o.l && !list.some(x=>x.l===o.l&&x.pres===(o.p||""))).map(o=>({l:o.l,pres:o.p||"",u:o.u,ex:o,s:o.s,fijo:true}));
      const all=list.concat(filas).filter(x=>x.l).sort((a,b)=>a.l-b.l); let tope=0;
      all.forEach(x=>{ if(x.u<tope){ x.u=tope; x.escalonado=true; if(x.fijo){ x.fijo=false; list.push({...x,id:it.id,it,costo:null,finca:null}); } } tope=x.u; });
    }
    list.forEach(x=>{ if(!x.ex || Math.abs(x.ex.u-x.u)>=0.005 || (x.s&&x.ex.s!==x.s)) props.push(x); });
  });
  return props.sort((a,b)=>a.it.n.localeCompare(b.it.n)||(a.l||0)-(b.l||0));
}

      ${P.map((x,i)=>{ const d0=x.ex? x.u-x.ex.u : 0; return `<tr${x.revisar?' class="warn"':""}><td><input type="checkbox" data-pp="${i}" ${x.revisar?"":"checked"}></td><td><b>${esc(x.it.n)}</b>${x.revisar?'<br><small style="color:var(--wine)">Revisar: gypsophila por peso</small>':""}</td><td>${esc(lbl(x))}</td>

  const close=()=>closeLayer();

  if(!P.length) return;

  $("#ppOk").onclick=async()=>{

    if(!sel.length){ $("#ppMsg").textContent="No marcaste ninguno."; return; }

    close(); busy("Actualizando precios…"); await loadCatalog(true); route(); toast(`${ok} precios actualizados. Ya se ven en la tienda.`);

/* ---------- Formato libre en una línea: "1 QB SPRAY BRILLANT STAR YELLOW 10st 80CM 10 $0,64" ----------
   Cajas + tipo de caja al inicio; el resto en cualquier orden: tallos por bunch (10st), largo (80cm), bunches por caja (10 o x10bu), precio por tallo ($0,64). */
const INL_START = /^(\d+)\s*(HB|QB|EB|FB)\b\s*/i;
const INL_TIPO = [[/^GARDEN\s+ROSES?\s+/i,[2,1]],[/^(SPRAY\s+ROSES?|SPRAY)\s+/i,[3]],[/^(ROSES?|ROSAS?)\s+/i,[1,2]]];
function buscarVariedad(nombre, tipos){
  const w=nombre.split(/\s+/).filter(Boolean), C=[nombre], C2=[];
  for(let n=w.length-1;n>=1;n--) C.push(w.slice(0,n).join(" "));      // sin el color o la palabra final
  for(let n=1;n<w.length;n++) C2.push(w.slice(n).join(" "));           // sin una palabra inicial ("Senecio Dusty miller")
  const pool=ITEMS.filter(i=>!tipos||tipos.includes(i.t));
  const sinY = x=>NK(x).replace(/and/g,"");                             // "high magic" = "High & Magic"
  { const k=sinY(nombre); const it=pool.find(i=>sinY(i.n)===k) || ITEMS.find(i=>sinY(i.n)===k); if(it) return it.id; }
  for(const c of C){ const x=findVar(c,tipos)||findVar(c); if(x) return x; }
  for(const c of C2){ const x=findVar(c,tipos)||findVar(c); if(x) return x; }
  for(const c of C){ const k=NK(c); if(k.length<(tipos?4:5)) continue; let best=null, bl=0;   // empieza igual ("snow" -> Snowflake)
    pool.forEach(i=>{ const n=NK(i.n); if(n.length>=5 && (k.startsWith(n)||n.startsWith(k)) && n.length>bl){ best=i.id; bl=n.length; } }); if(best) return best; }
  for(const c of C){ const k=NK(c); if(k.length<6) continue; let best=null, bd=9;   // errores de tipeo ("candelight", "kales crane")
    pool.forEach(i=>{ const n=NK(i.n); if(Math.abs(n.length-k.length)>2 || n.length<6) return; const d=osa(n,k); if(d<bd){ bd=d; best=i.id; } });
    if(bd<=(k.length>=9?2:1)) return best; }
  return null;
}
function osa(a,b){ const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; } for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); }
  return d[a.length][b.length]; }
function parseLinea(t){
  const m=t.match(INL_START); if(!m) return null;
  let s=t.slice(m[0].length).trim(), tipos=null, pre=null;
  const mq=s.match(/^(\d{1,4})\s+(?=[A-Za-z])/); if(mq){ pre=+mq[1]; s=s.slice(mq[0].length); }   // "5 qb 100 Bells…": lo que trae la caja
  for(const [rx,ts] of INL_TIPO){ if(rx.test(s)){ s=s.replace(rx,""); tipos=ts; break; } }
  if(pre!=null) s+=` x${pre}${pre>40?"st":"bu"}`;
  // rango de largos "40-50 cm" -> una línea por largo, mismo precio
  const mr=s.match(/\b(\d{2,3})\s*-\s*(\d{2,3})\s*cm\b/i);
  if(mr){ const a=+mr[1], b=+mr[2], Ls=[]; for(let l=a;l<=b;l+=10) Ls.push(l); if(!Ls.includes(b)) Ls.push(b);
    return Ls.map(l=>parseUna(t,m,s.replace(mr[0],` ${l}cm `),tipos)).filter(Boolean); }
  // varios largos con su precio: "50/60 0,32/0,35" -> dos líneas
  const ml=s.match(/\b(\d{2,3})\s*\/\s*(\d{2,3})(?:\s*\/\s*(\d{2,3}))?\s*(?:cm)?\b/i), mp=s.match(/\$?\s*(\d+[.,]\d+)\s*\/\s*\$?\s*(\d+[.,]\d+)(?:\s*\/\s*\$?\s*(\d+[.,]\d+))?/);
  if(ml){ const Ls=[ml[1],ml[2],ml[3]].filter(Boolean), Ps=mp?[mp[1],mp[2],mp[3]].filter(Boolean):[];
    const base=s.replace(ml[0]," ").replace(mp?mp[0]:"\u0000"," ");
    return Ls.map((l,i)=>parseUna(t,m,`${base} ${l}cm ${Ps[i]?"$"+Ps[i]:""}`,tipos)).filter(Boolean); }
  const r=parseUna(t,m,s,tipos); return r?[r]:null;
}
function parseUna(t,m,s,tipos){
  let tb=null, largo=null, uxc=null, costo=null, unidad="";
  s=s.replace(/\$\s*(\d+(?:[.,]\d+)?)/g,(_,v)=>{ if(costo==null) costo=+v.replace(",","."); return " "; });
  s=s.replace(/\b(\d{1,3})\s*(st|stems?|tallos?|tl)\b/gi,(_,v)=>{ tb=+v; return " "; });
  s=s.replace(/\b(\d{2,3})\s*cm\b/gi,(_,v)=>{ largo=+v; return " "; });
  s=s.replace(/\bx(\d{1,4})st\b/gi,(_,v)=>{ uxc=+v; unidad="tallos"; return " "; });
  s=s.replace(/\bx\s*(\d{1,4})\s*(bu|bunch(?:es)?|bun)?\b/gi,(_,v)=>{ uxc=+v; unidad="bunches"; return " "; });
  if(costo==null) s=s.replace(/\b(\d+[.,]\d{1,3})\b/,(_,v)=>{ costo=+v.replace(",","."); return " "; });
  s=s.replace(/\b(\d{1,3})\b/g,(_,v)=>{ v=+v;
    if(largo==null && v>=30 && v<=150 && v%10===0) largo=v;           // número suelto tipo 50, 60, 70 = largo
    else if(uxc==null){ uxc=v; unidad= v>40 ? "tallos" : "bunches"; }  // el siguiente = lo que trae la caja (más de 40 = tallos)
    return " "; });
  const nombre=s.replace(/[*_]/g," ").replace(/\s+/g," ").trim().replace(/\s*\+\s*$/,"");
  if(!nombre) return null;
  return {texto:t,id:buscarVariedad(nombre,tipos),nombre,largo,pres:"",cajas:+m[1],caja:m[2].toUpperCase(),uxc,unidad:uxc?unidad:"",tb,costo,nota:"",ignorar:false};
}
function parseInline(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).flatMap(t=>parseLinea(t) || [{texto:t,id:null,nombre:t,largo:null,pres:"",cajas:null,caja:"",uxc:null,unidad:"",costo:null,nota:"",ignorar:true}]);
}

/* ---------- Disponible en formato tabla: "3 HB ROSES FREEDOM 50 25 0,35" (cajas, tipo, variedad, largo, tallos/bunch, precio/tallo) ---------- */
const TAB_RX = /^(\d+)\s*(HB|QB|EB|FB)\s+(.+?)\s+(\d{2,3})\s+(\d{1,3})\s+(\d+(?:[.,]\d+)?)\s*$/i;
const TAB_TIPO = [[/^GARDEN\s+ROSES?\s+/i,[2,1]],[/^SPRAY\s+ROSES?\s+/i,[3]],[/^ROSES?\s+/i,[1,2]]];
function parseTabla(txt){
  const rows=[];
  txt.split(/\r?\n/).forEach(raw=>{ const t=raw.trim(); if(!t) return;
    const m=t.match(TAB_RX);
    if(!m){ rows.push({texto:t,id:null,nombre:t,largo:null,pres:"",cajas:null,caja:"",uxc:null,unidad:"",costo:null,nota:"",ignorar:true}); return; }
    let resto=m[3].trim(), tipos=null;
    for(const [rx,ts] of TAB_TIPO){ if(rx.test(resto)){ resto=resto.replace(rx,""); tipos=ts; break; } }
    const nombre=resto.replace(/\s*\+\s*$/,"").trim();
    const id = findVar(nombre,tipos) || findVar(resto) || findVar(nombre);
    rows.push({texto:t,id,nombre,largo:+m[4],pres:"",cajas:+m[1],caja:m[2].toUpperCase(),uxc:null,unidad:"",tb:+m[5],costo:+m[6].replace(",","."),nota:"",ignorar:false});
  });
  return rows;
}
function parseDispoText(txt){
  const L=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const tab=L.filter(l=>TAB_RX.test(l)).length;
  if(tab && tab>=L.length*0.5) return parseTabla(txt);
  // precio en la misma línea ($0,64 / 10st / 80cm): formato libre. Si no, el de Mystic (precio en el título de la sección).
  const inl=L.filter(l=>INL_START.test(l) && (/\$\s*\d/.test(l) || /\d\s*(st|stems?)\b/i.test(l) || /\d+[.,]\d+\s*$/.test(l))).length;
  const prod=L.filter(l=>INL_START.test(l)).length;
  if(inl && inl>=prod*0.5){
    const A=parseInline(txt), B=parseDispoTextProto(txt);
    return B.filter(r=>r.id).length > A.filter(r=>r.id).length ? B : A;
  }
  const B=parseDispoTextProto(txt);
  if(prod && B.filter(r=>r.id).length < prod*0.5){ const A=parseInline(txt); if(A.filter(r=>r.id).length > B.filter(r=>r.id).length) return A; }
  return B;
}

/* ---------- Bunches por caja (HB / QB / EB). Se edita en Panel › Entregas y se guarda en config_envios.bunches_por_caja ---------- */
const CAJAS_DEF = {rosas:{c:{HB:12,QB:8,EB:6}, l:{HB:10,QB:7,EB:5}}, fillers:{HB:16,QB:8,EB:4}, verdes:{HB:28,QB:14,EB:7}};
let CAJAS = JSON.parse(JSON.stringify(CAJAS_DEF));
function grupoCaja(t){ return t<=3 ? "rosas" : t===6 ? "verdes" : "fillers"; }     // flores de verano y exóticas van como fillers
function bunchesPorCaja(t, largo, caja){
  const g=grupoCaja(t), k=(caja||"").toUpperCase(); if(k==="FB") return null;
  const tabla = g==="rosas" ? ((largo||0)>=70 ? CAJAS.rosas.l : CAJAS.rosas.c) : CAJAS[g];
  return tabla && tabla[k] || null;
}
// Primero lo que dice la finca para ese producto (p. ej. Bellaflor: "Pack 30 · HB"); si no, la tabla general.
function bunchesDe(r, finca){
  const it=BYID[r.id]; if(!it||r.cajas==null) return null;
  if(r.uxc){ if(r.unidad==="bunches") return r.cajas*r.uxc; const tb=r.tb||(it.o[0]&&it.o[0].s)||tallosDefault(it); return tb? Math.round(r.cajas*r.uxc/tb) : null; }   // la finca dijo cuánto trae la caja
  const f = finca ?? r.finca ?? (typeof DRAFT!=="undefined" && DRAFT ? DRAFT.finca : null);
  const caja=(r.caja||"").toUpperCase();
  const of=(OFFER_LIVE[r.id]||[]).filter(o=>o.finca_id==f && o.bunches_por_caja && (!r.largo||!o.largo_cm||o.largo_cm===r.largo));
  const o=of.find(o=>(o.tipo_caja||"").toUpperCase()===caja) || of[0];
  if(o){ const k=(o.tipo_caja||"").toUpperCase();
    if(k===caja) return r.cajas*o.bunches_por_caja;
    const a=bunchesPorCaja(it.t,r.largo,k), b=bunchesPorCaja(it.t,r.largo,caja);
    if(a&&b) return Math.round(r.cajas*o.bunches_por_caja*b/a); }
  const n=bunchesPorCaja(it.t,r.largo,caja); return n? r.cajas*n : null;
}

const esLineaProducto = l => TAB_RX.test(l) || /^\d+\s*(hb|qb|eb|fb)\b/i.test(l);
// Separa el texto en bloques por finca (una línea con el nombre de la finca abre un bloque nuevo)
function bloquesPorFinca(txt, porDefecto){
  const out=[]; let cur=null;
  txt.split(/\r?\n/).forEach(l=>{
    const f = !esLineaProducto(l.trim()) && l.trim().length<80 ? fincaPorNombre(l) : null;
    if(f && (!cur || cur.finca!==f || cur.lineas.some(x=>esLineaProducto(x.trim())))){ cur={finca:f,lineas:[l]}; out.push(cur); return; }
    if(!cur){ cur={finca:null,lineas:[]}; out.push(cur); }
    cur.lineas.push(l);
  });
  return out.map(b=>{ const t=b.lineas.join("\n");
    let f=b.finca;
    if(!f){ const L=b.lineas.filter(x=>x.trim()); if(L.length && L.filter(x=>TAB_RX.test(x.trim())).length>=L.length*0.5) f=fincaPorNombre("hacienda"); }   // formato tabla = Flores de la Hacienda
    return {finca:f||+porDefecto, auto:!!f, texto:t};
  }).filter(b=>b.texto.split(/\r?\n/).some(x=>esLineaProducto(x.trim())||x.trim().length>3));
}

function groupDispo(dp){
  const by={};
  dp.forEach(r=>{ const k=r.finca_id+"|"+r.fecha; const g=(by[k] ||= {finca:r.finca_id, fecha:r.fecha, rows:[], sin:0});

  return Object.values(by);
}
async function saveDispo(D){
  const ok=D.rows.filter(r=>r.id&&!r.ignorar), sin=D.rows.filter(r=>!r.id&&!r.ignorar);
  if(!ok.length){ toast("No hay líneas reconocidas para guardar"); return; }
  const b=$("#dOk"); b.disabled=true; b.textContent="Guardando…";
  const toRow=r=>({finca_id:+D.finca, fecha:D.fecha, variedad_id:r.id||null, texto_original:r.texto||r.nombre||"", nombre_leido:r.nombre||null, largo_cm:r.largo?Math.round(r.largo):null, presentacion:r.pres||"",
    cajas:r.cajas==null?null:Math.round(r.cajas), tipo_caja:r.caja||null, unidades_por_caja:r.uxc==null?null:Math.round(r.uxc), unidad:r.unidad||null, costo_tallo_usd:r.costo==null?null:r.costo, nota:r.nota||null, ...(r.tb?{tallos_por_bunch:Math.round(r.tb)}:{})});
  const del = await sb.from("disponibilidad_finca").delete().eq("finca_id",+D.finca).eq("fecha",D.fecha);
  let ins = del.error ? del : await sb.from("disponibilidad_finca").insert(ok.concat(sin).map(toRow));
  if(ins.error && /tallos_por_bunch/.test(ins.error.message)){   // falta correr el SQL 10: se guarda sin tallos por bunch
    ins = await sb.from("disponibilidad_finca").insert(ok.concat(sin).map(r=>{ const x=toRow(r); delete x.tallos_por_bunch; return x; }));
    toast("Guardado sin tallos por bunch: falta correr 10_disponibles_tabla.sql en Supabase"); }
  if(ins.error){ b.disabled=false; b.textContent="Confirmar y guardar"; toast("No se pudo guardar: "+ins.error.message); return; }
  state.dispo=(state.dispo||[]).filter(d=>!(d.finca==D.finca&&d.fecha===D.fecha));
  state.dispo.push({finca:+D.finca, fecha:D.fecha, rows:ok.map(({ignorar,...r})=>r), sin:sin.length});
  DRAFT=null; toast(`Disponible de ${FARMS[D.finca]} guardado · ${ok.length} líneas`); renderDispo();
  const sv=state.dispo[state.dispo.length-1];
  siguienteDeCola();
  if(sv.rows.some(r=>r.costo!=null)) abrirPropuesta(sv);
  sb.from("shop_confirmado").select("*").then(({data})=>{ if(data){ CONFIRMED={}; data.forEach(r=>(CONFIRMED[r.variedad_id] ||= []).push(r.largo_cm||null)); } });
}

function farmOptions(line){
  const len = line.l || parseInt(line.opt) || null, by={};
  (OFFER_LIVE[line.id]||[]).filter(o=>!len||!o.largo_cm||o.largo_cm===len).forEach(o=>{
    const d=freshDispo().filter(x=>x.finca==o.finca_id).flatMap(x=>x.rows).find(r=>r.id===line.id&&(!len||!r.largo||r.largo===len)&&r.costo!=null);
    const per = d? +d.costo : o.costo_usd!=null? +o.costo_usd : null;
    const stems = line.s || o.tallos_por_bunch || 1;
    const opt = {fid:o.finca_id, name:FARMS[o.finca_id]||"Finca "+o.finca_id, cost: per==null?0:Math.round(per*stems*100)/100, nc: per==null, real:!!d};

  });
  return Object.values(by);
}

/* ---------- fotos: si están dentro de una carpeta del bucket, las busca ahí ---------- */
const IMG_PREFIX = ["fotos_flores/","imagenes/","fotos/","catalogo_maestro/imagenes/"];
document.addEventListener("error", e=>{
  const im=e.target; if(!im || im.tagName!=="IMG" || !im.src.includes("/object/public/flores/")) return;
  const k=+(im.dataset.try||0); if(k>=IMG_PREFIX.length) return;
  const base=im.dataset.orig || im.src; im.dataset.orig=base; im.dataset.try=k+1;
  im.src=base.replace("/object/public/flores/","/object/public/flores/"+IMG_PREFIX[k]);
}, true);

/* ---------- leer disponibles (texto o foto) con IA a través de la función nexa ---------- */
function imgToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,1800/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.85).split(",")[1]); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
async function sampleFn(){
  return { limits: async()=>({images:true}),
    json: async(prompt, opts={})=>{
      const imagen = opts.images && opts.images[0] ? await imgToB64(opts.images[0]) : null;
      const r = await nexaFn({accion:"leer_dispo", prompt, imagen});
      const err = r.error ? (await r.error.context?.json?.().catch(()=>null))?.error || r.error.message : r.data && r.data.error;
      if(err){ toast(/ANTHROPIC/.test(err)?"Falta activar la lectura con IA (clave de Anthropic en Supabase)":"IA: "+err); throw {code:"ia", message:err}; }
      return r.data.lista;
    } };
}


/* ---------- actualización automática: pedidos y clientes nuevos sin recargar ---------- */
let LAST_SIG="", REFRESHING=false;
const sig = ()=>JSON.stringify([state.orders.map(o=>[o.id,o.status]), (state.clients||[]).map(c=>[c.id,c.estado])]);
async function autoRefresh(){
  if(REFRESHING || document.hidden || !state.user) return;
  const busyUI = $("#layer").innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  const v=(location.hash||"").slice(1);
  const admin=isAdmin(), client=state.user.role==="client"&&state.user.status==="approved";
  if(!admin && !client) return;
  REFRESHING=true;
  try{
    const before = LAST_SIG || sig();
    await loadOrders(admin);
    if(admin){ const cl = await all(()=>sb.from("clientes").select("*").order("creado",{ascending:false}));
      state.clients = cl.map(c=>({id:c.id, biz:c.negocio||c.email, type:c.tipo_negocio||"", email:c.email||"", status:CL_FROM_DB[c.estado]||"pending", estado:c.estado,
        list:(LISTAS.find(l=>l.id===c.lista_precio_id)||{}).nombre||"General", lista_id:c.lista_precio_id, wire:!!c.permite_transferencia,
        contact:c.nombre_contacto||"", phone:c.telefono||"", addr:c.direccion_entrega||"", resale:c.resale_certificate||"", creado:c.creado})); }
    LAST_SIG = sig();
    const live = admin ? (/^(semana|pedidos|clientes)$/.test(v) || v.startsWith("orden-")) : v==="orders";
    if(LAST_SIG!==before && live && !busyUI){ const y=window.scrollY; route(); window.scrollTo(0,y);
      if(admin) toast("Actualizado: hay cambios en pedidos o clientes"); }
  }catch(e){ console.warn("auto-refresh",e); }
  REFRESHING=false;
}
setInterval(autoRefresh, 45000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) autoRefresh(); });

/* ---------- arranque ---------- */
async function boot(){
  busy();
  const qs=new URLSearchParams(location.search), paid=qs.get("paid");
  const hashErr = /error_description=([^&]+)/.exec(location.hash);
  try{
    await loadConfig();
    const {data:{session}} = await sb.auth.getSession();
    if(/access_token=|error_description=|type=magiclink|type=signup/.test(location.hash)) history.replaceState(null,"",location.pathname+location.search+"#shop");
    if(session) await loadUser(session.user); else state.user=null;
  }catch(e){
    console.error(e);
    $("#app").innerHTML=`<div class="wrap view"><p class="empty" style="padding:60px 0">We couldn't load the shop right now. Please refresh the page, or message us on <a href="https://wa.me/17733795759">WhatsApp</a>.<br><small>${esc(e.message||e)}</small></p></div>`;
    return;
  }
  if(paid){ NOTICE={kind:"paid", num:paid}; history.replaceState(null,"",location.pathname+"#orders"); }
  route();
  if(hashErr && !state.user) toast("That login link expired. Enter your email to get a new one.");
  sb.auth.onAuthStateChange(async (ev, session)=>{
    if(ev==="SIGNED_IN" && session && (!state.user || state.user.email!==session.user.email)){ busy(); await loadUser(session.user); route(); }
    if(ev==="SIGNED_OUT" && state.user){ state.user=null; route(); }
  });
}
boot();
